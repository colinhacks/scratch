# A new user's install of reylo, through each channel reylo.dev documents, and a walk through
# Reylo Migrate (reylo-e2e/e2e.sh) on SQLite, Postgres and MySQL, on every platform reylo ships for.
name: reylo-migrate-e2e

on:
  push:
    branches: [reylo-migrate-e2e]

permissions:
  contents: read

env:
  REYLO_VERSION: 0.8.3

jobs:
  linux:
    name: linux ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            cpu: x64
          - runner: ubuntu-24.04-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 2s --health-timeout 5s --health-retries 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "Channel: curl install.sh"
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL https://reylo.dev/install.sh | sh
          env -u CI bash reylo-e2e/smoke.sh curl "$HOME/.local/bin/reylo"
      - name: "Channel: npm install --global"
        if: ${{ !cancelled() }}
        run: |
          npm install --global "reylo@$REYLO_VERSION"
          env -u CI bash reylo-e2e/smoke.sh npm "$(npm prefix --global)/bin/reylo"
      - name: "Channel: npx"
        if: ${{ !cancelled() }}
        run: |
          printf '#!/bin/sh\nexec npx --yes reylo@%s "$@"\n' "$REYLO_VERSION" > "$RUNNER_TEMP/npx-reylo" && chmod +x "$RUNNER_TEMP/npx-reylo"
          env -u CI bash reylo-e2e/smoke.sh npx "$RUNNER_TEMP/npx-reylo"
      - name: "Channel: Homebrew"
        if: ${{ !cancelled() && matrix.cpu == 'x64' }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install reylosql/tap/reylo
          env -u CI bash reylo-e2e/smoke.sh brew "$(brew --prefix)/bin/reylo"
      - name: "Channel: mise"
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$RUNNER_TEMP/mise" sh
          mkdir -p "$RUNNER_TEMP/mise-project" && cd "$RUNNER_TEMP/mise-project"
          printf '[tools]\n"github:reylosql/reylo" = "%s"\n' "$REYLO_VERSION" > mise.toml
          "$RUNNER_TEMP/mise" trust && "$RUNNER_TEMP/mise" install
          env -u CI bash "$GITHUB_WORKSPACE/reylo-e2e/smoke.sh" mise "$("$RUNNER_TEMP/mise" which reylo)"
      - name: "Channel: Docker image"
        if: ${{ !cancelled() }}
        run: |
          docker pull -q "ghcr.io/reylosql/reylo:$REYLO_VERSION"
          printf '#!/bin/sh\nexec docker run --rm --network host -e CI --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work ghcr.io/reylosql/reylo:%s "$@"\n' "$REYLO_VERSION" > "$RUNNER_TEMP/docker-reylo" && chmod +x "$RUNNER_TEMP/docker-reylo"
          env -u CI bash reylo-e2e/smoke.sh docker "$RUNNER_TEMP/docker-reylo"
      - name: "Migrate walk: SQLite"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh sqlite "$RUNNER_TEMP/e2e-sqlite"
      - name: "Migrate walk: Postgres 18"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: postgres://postgres@127.0.0.1:5432
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh postgres "$RUNNER_TEMP/e2e-postgres"
      - name: "Migrate walk: MySQL 8.4"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: mysql://root@127.0.0.1:3306
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh mysql "$RUNNER_TEMP/e2e-mysql"
      - name: "Migrate walk through the Docker image: Postgres 18"
        if: ${{ !cancelled() }}
        env:
          E2E_SERVER: postgres://postgres@127.0.0.1:5432
        run: |
          mkdir -p "$RUNNER_TEMP/docker-bin" && cp "$RUNNER_TEMP/docker-reylo" "$RUNNER_TEMP/docker-bin/reylo"
          env -u CI PATH="$RUNNER_TEMP/docker-bin:$PATH" bash reylo-e2e/e2e.sh postgres "$RUNNER_TEMP/e2e-docker"
      # libSQL (Turso's server): the SQLite walk's migrations deployed to it over libsql://.
      - name: "Migrate on a libSQL server"
        if: ${{ !cancelled() }}
        run: |
          docker run -d --name sqld -p 8080:8080 ghcr.io/tursodatabase/libsql-server:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/health > /dev/null && break; sleep 1; done
          cd "$RUNNER_TEMP/e2e-sqlite"
          export PATH="$HOME/.local/bin:$PATH"
          url="libsql://127.0.0.1:8080?tls=0"
          reylo migrate deploy --url "$url"
          reylo migrate status --url "$url"
          reylo run --url "$url" "create index users_by_name on users (name)"
          if reylo migrate deploy --url "$url"; then echo "FAIL: deploy took a hand-changed libSQL database"; exit 1; fi
          reylo db introspect --url "$url" | grep -q "create table users"
          echo "PASS libSQL: deploy, status, drift refusal, introspect"
      # musl: Alpine, with install.sh through busybox wget (the image has no curl).
      - name: "Alpine (musl): install.sh through wget, npm, and the walk on all three"
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --network host -e REYLO_VERSION -v "$GITHUB_WORKSPACE:/src:ro" node:24-alpine sh -c '
            set -e
            apk add --no-cache bash > /dev/null
            command -v curl && echo "curl is present, so wget is not exercised" || true
            wget -qO- https://reylo.dev/install.sh | sh
            bash /src/reylo-e2e/smoke.sh wget-alpine /root/.local/bin/reylo
            npm install --global "reylo@$REYLO_VERSION" > /dev/null
            bash /src/reylo-e2e/smoke.sh npm-alpine "$(npm prefix --global)/bin/reylo"
            export PATH=/root/.local/bin:$PATH E2E_NODE=1
            status=0
            bash /src/reylo-e2e/e2e.sh sqlite /tmp/e2e-sqlite || status=1
            E2E_SERVER=postgres://postgres@127.0.0.1:5432 bash /src/reylo-e2e/e2e.sh postgres /tmp/e2e-postgres || status=1
            E2E_SERVER=mysql://root@127.0.0.1:3306 bash /src/reylo-e2e/e2e.sh mysql /tmp/e2e-mysql || status=1
            exit $status
          '
      # Older and smaller distributions: install.sh alone.
      - name: "install.sh on Debian 12, AlmaLinux 8 and Amazon Linux 2023"
        if: ${{ !cancelled() }}
        run: |
          status=0
          for image in debian:12 almalinux:8 amazonlinux:2023; do
            echo "== $image"
            docker run --rm -e REYLO_VERSION -v "$GITHUB_WORKSPACE:/src:ro" "$image" bash -c '
              set -e
              if command -v apt-get > /dev/null; then apt-get update -qq > /dev/null && apt-get install -y -qq curl ca-certificates > /dev/null; fi
              if [ -f /etc/os-release ] && grep -q amzn /etc/os-release; then
                echo "-- without tar, as the image comes:"
                curl -fsSL https://reylo.dev/install.sh | sh && echo "UNEXPECTED: installed with no tar" || true
                dnf install -y -q tar gzip > /dev/null
              fi
              curl -fsSL https://reylo.dev/install.sh | sh
              bash /src/reylo-e2e/smoke.sh "install.sh-$(. /etc/os-release && echo $ID-$VERSION_ID)" /root/.local/bin/reylo
            ' || status=1
          done
          exit $status

  macos:
    name: macos ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            cpu: arm64
          - runner: macos-15-intel
            cpu: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "Channel: curl install.sh"
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL https://reylo.dev/install.sh | sh
          env -u CI bash reylo-e2e/smoke.sh curl "$HOME/.local/bin/reylo"
      - name: "Channel: Homebrew"
        if: ${{ !cancelled() }}
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install reylosql/tap/reylo
          env -u CI bash reylo-e2e/smoke.sh brew "$(brew --prefix)/bin/reylo"
      - name: "Channel: npm install --global"
        if: ${{ !cancelled() }}
        run: |
          npm install --global "reylo@$REYLO_VERSION"
          env -u CI bash reylo-e2e/smoke.sh npm "$(npm prefix --global)/bin/reylo"
      - name: "Channel: mise"
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$RUNNER_TEMP/mise" sh
          mkdir -p "$RUNNER_TEMP/mise-project" && cd "$RUNNER_TEMP/mise-project"
          printf '[tools]\n"github:reylosql/reylo" = "%s"\n' "$REYLO_VERSION" > mise.toml
          "$RUNNER_TEMP/mise" trust && "$RUNNER_TEMP/mise" install
          env -u CI bash "$GITHUB_WORKSPACE/reylo-e2e/smoke.sh" mise "$("$RUNNER_TEMP/mise" which reylo)"
      - name: Start Postgres 18
        if: ${{ !cancelled() }}
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install postgresql@18 > /dev/null
          bin="$(brew --prefix postgresql@18)/bin"
          "$bin/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust -E UTF8 --locale=C > /dev/null
          "$bin/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 5432 -c listen_addresses=127.0.0.1" -l "$RUNNER_TEMP/pg.log" -w start
      - name: "Migrate walk: SQLite"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh sqlite "$RUNNER_TEMP/e2e-sqlite"
      - name: "Migrate walk: Postgres 18"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: postgres://postgres@127.0.0.1:5432
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh postgres "$RUNNER_TEMP/e2e-postgres"
      - name: Start MySQL 8.4
        if: ${{ !cancelled() }}
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install mysql@8.4 > /dev/null
          bin="$(brew --prefix mysql@8.4)/bin" d="$RUNNER_TEMP/mysql"
          mkdir -p "$d"
          "$bin/mysqld" --no-defaults --initialize-insecure --datadir="$d/data" --user="$USER"
          "$bin/mysqld" --no-defaults --daemonize --datadir="$d/data" --socket="$d/sock" --port=3306 --bind-address=127.0.0.1 --mysqlx=OFF --pid-file="$d/pid" --log-error="$d/err.log" --user="$USER"
          "$bin/mysql" -uroot -h127.0.0.1 -P3306 -e "select version()"
      - name: "Migrate walk: MySQL 8.4"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: mysql://root@127.0.0.1:3306
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh mysql "$RUNNER_TEMP/e2e-mysql"

  windows:
    name: windows ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            cpu: x64
          - runner: windows-11-arm
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "Channel: install.ps1 in PowerShell 7"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: irm https://reylo.dev/install.ps1 | iex
      - name: "Channel: install.ps1 in PowerShell 7, checked"
        if: ${{ !cancelled() }}
        run: env -u CI bash reylo-e2e/smoke.sh install.ps1 "$HOME/.local/bin/reylo.exe"
      - name: "Channel: install.ps1 in Windows PowerShell 5.1"
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $env:REYLO_INSTALL_DIR = "$env:RUNNER_TEMP\ps51"
          $env:REYLO_NO_MODIFY_PATH = "1"
          irm https://reylo.dev/install.ps1 | iex
      - name: "Channel: install.ps1 in Windows PowerShell 5.1, checked"
        if: ${{ !cancelled() }}
        run: env -u CI bash reylo-e2e/smoke.sh install.ps1-5.1 "$RUNNER_TEMP/ps51/reylo.exe"
      - name: "Channel: Scoop"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          irm get.scoop.sh -OutFile "$env:RUNNER_TEMP\scoop.ps1"
          & "$env:RUNNER_TEMP\scoop.ps1" -RunAsAdmin
          $env:Path = "$HOME\scoop\shims;$env:Path"
          scoop bucket add reylo https://github.com/reylosql/scoop-bucket
          scoop install reylo
      - name: "Channel: Scoop, checked"
        if: ${{ !cancelled() }}
        run: env -u CI bash reylo-e2e/smoke.sh scoop "$HOME/scoop/shims/reylo.exe"
      - name: "Channel: npm install --global"
        if: ${{ !cancelled() }}
        run: |
          npm install --global "reylo@$REYLO_VERSION"
          env -u CI bash reylo-e2e/smoke.sh npm "$(cygpath -u "$(npm prefix --global)")/reylo"
      # windows-11-arm carries no Postgres: install EDB's build (x64, emulated) through Chocolatey.
      - name: Install Postgres where the runner has none
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if ($env:PGBIN -and (Test-Path "$env:PGBIN\initdb.exe")) { "PGBIN=$env:PGBIN"; exit 0 }
          choco install postgresql17 -y --no-progress --params '/Password:postgres /Port:5433'
          $bin = (Get-ChildItem "C:\Program Files\PostgreSQL\*\bin\initdb.exe" | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "no Postgres after choco" }
          Stop-Service postgresql* -ErrorAction SilentlyContinue
          "PGBIN=$bin" >> $env:GITHUB_ENV
      - name: Start Postgres
        id: pg
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${PGBIN:-}" ] || [ ! -x "$PGBIN/initdb.exe" ]; then echo "no Postgres on this runner"; exit 0; fi
          "$PGBIN/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust -E UTF8 --locale=C > /dev/null
          "$PGBIN/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 25432 -c listen_addresses=127.0.0.1" -l "$RUNNER_TEMP/pg.log" -w start
          "$PGBIN/psql" -h 127.0.0.1 -p 25432 -U postgres -At -c "select version()"
          echo "url=postgres://postgres@127.0.0.1:25432" >> "$GITHUB_OUTPUT"
      - name: "Migrate walk: SQLite"
        if: ${{ !cancelled() }}
        env:
          E2E_NODE: "1"
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh sqlite "$RUNNER_TEMP/e2e-sqlite"
      - name: "Migrate walk: Postgres"
        if: ${{ !cancelled() && steps.pg.outputs.url != '' }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: ${{ steps.pg.outputs.url }}
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh postgres "$RUNNER_TEMP/e2e-postgres"
      # The runner's MySQL where it has one, else Chocolatey's; as a Windows service, since the
      # runner stops every process a step started when the step ends.
      - name: Start MySQL
        id: mysql
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bin = (Get-ChildItem "C:\Program Files\MySQL\*\bin\mysqld.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          if (-not $bin) {
            choco install mysql -y --no-progress
            $bin = (Get-ChildItem "C:\tools\mysql\*\bin\mysqld.exe", "C:\tools\mysql\current\bin\mysqld.exe", "C:\Program Files\MySQL\*\bin\mysqld.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          }
          if (-not $bin) { throw "no MySQL server on this runner, nor from choco" }
          & "$bin\mysqld.exe" --version
          $data = "$env:RUNNER_TEMP\mysql".Replace("\", "/")
          $ini = "$env:RUNNER_TEMP\e2e-mysql.ini"
          Set-Content $ini "[mysqld]`ndatadir=$data`nport=23306`nbind-address=127.0.0.1`nmysqlx=OFF`nlog-error=$data.log"
          & "$bin\mysqld.exe" "--defaults-file=$ini" --initialize-insecure
          & "$bin\mysqld.exe" --install E2EMySQL "--defaults-file=$ini"
          Start-Service E2EMySQL
          for ($i = 0; $i -lt 60; $i++) { & "$bin\mysqladmin.exe" --user=root --host=127.0.0.1 --port=23306 ping 2>$null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 1 }
          & "$bin\mysql.exe" --user=root --host=127.0.0.1 --port=23306 -e "select version()"
          "url=mysql://root@127.0.0.1:23306" >> $env:GITHUB_OUTPUT
      - name: "Migrate walk: MySQL"
        if: ${{ !cancelled() && steps.mysql.outputs.url != '' }}
        env:
          E2E_NODE: "1"
          E2E_SERVER: ${{ steps.mysql.outputs.url }}
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh mysql "$RUNNER_TEMP/e2e-mysql"

  # Each Postgres and MySQL version the docs claim, beyond the 18 and 8.4 the jobs above run.
  versions:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["postgres:14", "postgres:15", "postgres:16", "postgres:17", "postgres:19", "mysql:8.0.38", "mysql:9.7"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start ${{ matrix.image }}
        id: db
        run: |
          image="${{ matrix.image }}"
          case "$image" in
            postgres:*)
              docker run -d --name db -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust "$image"
              for i in $(seq 1 60); do docker exec db pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
              docker exec db psql -U postgres -Atc "select version()"
              echo "dialect=postgres" >> "$GITHUB_OUTPUT"; echo "url=postgres://postgres@127.0.0.1:5432" >> "$GITHUB_OUTPUT" ;;
            mysql:*)
              docker run -d --name db -p 3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes "$image"
              for i in $(seq 1 120); do docker exec db mysql -uroot -h127.0.0.1 -e "select 1" > /dev/null 2>&1 && break; sleep 1; done
              docker exec db mysql -uroot -h127.0.0.1 -e "select version(), @@gtid_mode"
              echo "dialect=mysql" >> "$GITHUB_OUTPUT"; echo "url=mysql://root@127.0.0.1:3306" >> "$GITHUB_OUTPUT" ;;
          esac
          curl -fsSL https://reylo.dev/install.sh | sh
          command -v pg_dump && pg_dump --version || true
      - name: Migrate walk
        env:
          E2E_NODE: "1"
          E2E_SERVER: ${{ steps.db.outputs.url }}
        run: env -u CI PATH="$HOME/.local/bin:$PATH" bash reylo-e2e/e2e.sh "${{ steps.db.outputs.dialect }}" "$RUNNER_TEMP/e2e"

  rust:
    name: rust ${{ matrix.os }} ${{ matrix.dialect }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, dialect: postgres }
          - { os: linux, runner: ubuntu-latest, dialect: mysql }
          - { os: linux, runner: ubuntu-latest, dialect: sqlite }
          - { os: macos, runner: macos-15, dialect: sqlite }
          - { os: windows, runner: windows-latest, dialect: sqlite }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: rustup update stable && rustup default stable && rustc --version
      - name: "Channel: cargo binstall reylo-cli (unix)"
        if: ${{ matrix.os != 'windows' }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y "reylo-cli@$REYLO_VERSION"
      - name: "Channel: cargo binstall reylo-cli (windows)"
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy Unrestricted -Scope Process
          iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
          cargo binstall -y "reylo-cli@$env:REYLO_VERSION"
      - name: "Channel: cargo binstall, checked"
        run: env -u CI bash reylo-e2e/smoke.sh cargo-binstall "$(command -v reylo)"
      - name: Start the server
        id: db
        run: |
          case "${{ matrix.dialect }}" in
            postgres)
              docker run -d --name db -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18
              for i in $(seq 1 60); do docker exec db pg_isready -U postgres > /dev/null 2>&1 && break; sleep 1; done
              echo "url=postgres://postgres@127.0.0.1:5432" >> "$GITHUB_OUTPUT" ;;
            mysql)
              docker run -d --name db -p 3306:3306 -e MYSQL_ALLOW_EMPTY_PASSWORD=yes mysql:8.4
              for i in $(seq 1 120); do docker exec db mysql -uroot -h127.0.0.1 -e "select 1" > /dev/null 2>&1 && break; sleep 1; done
              echo "url=mysql://root@127.0.0.1:3306" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: A Rust app whose migrations run through reylo::migrate!()
        env:
          E2E_SERVER: ${{ steps.db.outputs.url }}
        run: env -u CI bash reylo-e2e/rust.sh "${{ matrix.dialect }}" "$RUNNER_TEMP/rs-app"
