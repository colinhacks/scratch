name: approve-test
on:
  workflow_dispatch:
permissions:
  actions: write
  deployments: write
  contents: read
jobs:
  approve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -x
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=waiting&per_page=10" --jq '.workflow_runs[].id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/pending_deployments" > pd.json
            cat pd.json
            envid=$(jq -r '.[0].environment.id' pd.json)
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/pending_deployments" \
              --input <(jq -n --argjson e "$envid" '{environment_ids:[$e], state:"approved", comment:"job token approval test"}') \
              && echo "APPROVE_OK $run" || echo "APPROVE_FAILED $run"
          done
